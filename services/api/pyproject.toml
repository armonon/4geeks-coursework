[project]
name = "trackflow-api"
version = "1.0.0"
description = "TrackFlow backend API — supplier directory (TinyDB) + incident analysis."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.20",
    "tinydb>=4.8",
    # incident-analyzer is installed from the local monorepo:
    #   pip install -e packages/incident_analyzer
    # See README.md for the bootstrap.
    "incident-analyzer",
]

[project.scripts]
# Enables `uv run seed`.
seed = "seed:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout: the milestone specifies main.py / models.py / database.py /
# seed.py at services/api/ with routes/ beside them.
py-modules = ["main", "models", "database", "seed"]

[tool.setuptools.packages.find]
include = ["routes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv.sources]
incident-analyzer = { path = "../../packages/incident_analyzer", editable = true }

[tool.ruff]
extend-exclude = [".venv"]
# The seed data is transcribed verbatim from CONTEXT.md; a few of those
# note strings run past 88 columns and reflowing them would obscure that
# they are copied exactly.
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = [
    # `class Status(str, Enum)` is the idiom FastAPI's own docs use for
    # path/query enums. StrEnum would work on 3.11+ but this is the
    # shape every FastAPI reader expects.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Query()/File()/Depends()
# in argument defaults on purpose. B008 exists for mutable defaults;
# these are not that.
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Depends",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Form",
]
