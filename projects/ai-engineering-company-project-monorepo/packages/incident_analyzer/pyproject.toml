[project]
name = "incident-analyzer"
version = "0.1.0"
description = "TrackFlow incident-report CSV analyser — shared between scripts/analyze.py and services/api. Never quotes customer emails per CONTEXT rules."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["incident_analyzer*"]
