[project]
name = "streamloop-churn-model-tuning"
version = "0.1.0"
description = "Leakage-safe StreamLoop churn model tuning"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4",
  "jupyter>=1.1",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pandas>=2.2",
  "pytest>=8.3",
  "scikit-learn>=1.6",
  "scipy>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamloop"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
